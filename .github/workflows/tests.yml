name: Tests

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "cases/**", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Run tests (offline, mockllm only)
        run: uv run pytest -q
