name: Run benchmark

on:
  push:
    branches: [main]
    paths: ["eval/run_request.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regbench
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          pip install -q -r eval/requirements.txt

      - name: Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python eval/run.py

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "pablof11"
          git config user.email "pablof11@users.noreply.github.com"
          git add eval/results
          git diff --cached --quiet && exit 0
          git commit -q -m "Benchmark results: $(python -c 'import json;print(json.load(open("eval/run_request.json"))["run_id"])')"
          git pull -q --rebase origin main
          git push -q origin main
